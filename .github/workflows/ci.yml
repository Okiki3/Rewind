name: REWIND checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  frontend-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx tsc --project sdk/tsconfig.json
      - run: node --test keeper/scan.test.mjs
      - run: cd keeper && npm install --no-fund --no-audit
      - run: cd keeper && node --input-type=module -e "import nearAPI from 'near-api-js'; if (!nearAPI.connect || !nearAPI.KeyPair || !nearAPI.keyStores) throw Error('Missing keeper runtime exports')"
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --locked
      - run: cargo build --release --target wasm32-unknown-unknown --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-audit --no-fund near-workspaces@5.0.0 near-sandbox@0.3.5
      # NEAR workspaces currently bundles a sandbox runtime that can lag
      # Testnet protocol upgrades. Capture its failure, but still run a
      # separate genuinely onchain Testnet test before any deployment.
      - name: NEAR Sandbox compatibility check
        run: node integration/sandbox.mjs
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: rewind-contract-wasm
          path: target/wasm32-unknown-unknown/release/rewind_escrow.wasm
          if-no-files-found: error

  testnet-proof:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[testnet-proof]')
    needs: [contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: rewind-contract-wasm
          path: target/wasm32-unknown-unknown/release
      - run: npm ci
      - run: npm install --no-save --no-audit --no-fund near-workspaces@5.0.0
      - run: node integration/testnet-proof.mjs
