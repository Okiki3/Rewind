name: REWIND checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  frontend-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx tsc --project sdk/tsconfig.json
      - run: node --test keeper/scan.test.mjs
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --locked
      - run: cargo build --release --target wasm32-unknown-unknown --locked
