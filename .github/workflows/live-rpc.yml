name: REWIND live RPC and recipient verification
on:
  push:
    branches: ["fix/fastnear-rpc-and-delivery-20261114"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-rpc.mjs
