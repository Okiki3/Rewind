name: Prevent accidental disclosure of REWIND credentials
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  public-release-secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan full reachable Git history and current files
        shell: bash
        run: |
          set +e
          /tmp/gitleaks git --log-opts="--all" --redact=100 --no-banner --log-level warn .
          HISTORY_STATUS=$?
          /tmp/gitleaks dir --redact=100 --no-banner --log-level warn .
          FILE_STATUS=$?
          set -e
          if [ "$HISTORY_STATUS" -ne 0 ] || [ "$FILE_STATUS" -ne 0 ]; then
            echo "::error::Possible secret exposure detected or scanner failed. Review privately before making this repository public."
            exit 1
          fi
          echo "SECRET_AUDIT_PASS: current files and reachable Git history have no Gitleaks findings."
