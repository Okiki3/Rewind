name: REWIND independent read-only security review
on:
  push:
    branches: [feat/security-release-review-20261114]
  pull_request:
    paths:
      - 'sdk/**'
      - 'scripts/security-readonly-audit.mjs'
      - 'contract/**'
      - '.github/workflows/security-review.yml'
permissions:
  contents: read
jobs:
  sdk-contract-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked JS dependencies
        run: npm ci
      - name: Build JavaScript app and distributable SDK
        run: npm run build
      - name: Verify live public SDK bytes, CORS, MIME and onchain ownership keys
        run: node scripts/security-readonly-audit.mjs
  js-dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail if production JavaScript dependency vulnerabilities are high or critical
        run: npm audit --omit=dev --audit-level=high
  rust-dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Rust dependencies against RustSec advisories
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
