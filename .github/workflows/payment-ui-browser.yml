name: REWIND payment UI browser regression
on:
  push:
    branches: [feat/live-transfer-receipt-history, main]
    paths:
      - src/**
      - scripts/browser-smoke.mjs
      - .github/workflows/payment-ui-browser.yml
      - package.json
      - package-lock.json
      - sdk/**
  pull_request:
    branches: [main]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - run: npm run build
        env:
          VITE_BASE_PATH: /rewind/
          VITE_NEAR_NETWORK_ID: testnet
          VITE_NEAR_CONTRACT_ID: rewind.rewindproof-mwfi8ufi-fa888154e57d.testnet
      - run: node scripts/browser-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewind-payment-ui
          path: |
            rewind-browser-smoke.png
            rewind-browser-receipt.png
          if-no-files-found: ignore
