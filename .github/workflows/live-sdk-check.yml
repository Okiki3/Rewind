name: Live public REWIND SDK origin check
on:
  push:
    branches: [audit/live-sdk-origin-test]
jobs:
  test-public-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/public-sdk-check.mjs
